name: Release

on:
  workflow_dispatch:
    inputs:
      suffix:
        type: string
        default: ''
        description: '镜像 tag 后缀：tag 变成 0.12.2-xx（同一上游版本重打镜像时用）'
      version:
        type: string
        default: ''
        description: '指定 @agegr/pi-web 版本；留空取 npm 上的最新版'
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pi-web-custom
  PKG: '@agegr/pi-web'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      imagetag: ${{ steps.ver.outputs.imagetag }}
      build: ${{ steps.exists.outputs.build }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15

      - name: Resolve target version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(npm view "$PKG" version 2>/dev/null || true)
          fi
          [ -n "$version" ] || { echo "::error::cannot resolve $PKG version"; exit 1; }
          imagetag="${version}${INPUT_SUFFIX:+-${INPUT_SUFFIX}}"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "imagetag=$imagetag" >> "$GITHUB_OUTPUT"
          echo "$PKG = $version  ->  $IMAGE:$imagetag"

      - name: Log in to GHCR
        if: github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip when image tag already exists
        id: exists
        if: github.event_name == 'schedule'
        env:
          IMAGETAG: ${{ steps.ver.outputs.imagetag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$IMAGETAG" >/dev/null 2>&1; then
            echo "image tag $IMAGE:$IMAGETAG already exists, nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: tags
        env:
          IMAGETAG: ${{ needs.check.outputs.imagetag }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          tags="$IMAGE:$IMAGETAG"
          if [ -z "$INPUT_SUFFIX" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args:
            PI_WEB_VERSION=${{ needs.check.outputs.version }}
